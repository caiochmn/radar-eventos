name: Coletar eventos

on:
  schedule:
    # 09:00 e 21:00 no horário de Brasília (UTC-3)
    - cron: '0 12,0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'

permissions:
  contents: write

concurrency:
  group: coletar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Coletar agendas
        run: node scripts/coletar.mjs

      - name: Publicar se mudou
        run: |
          if git diff --quiet -- dados/eventos.json; then
            echo "Nenhuma mudança na agenda."
            exit 0
          fi
          total=$(node -p "require('./dados/eventos.json').totalEventos")
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/eventos.json
          git commit -m "Atualiza agenda: ${total} eventos"
          git push
